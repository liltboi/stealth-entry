<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04060d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304060d'/%3E%3Cpath d='M16 5l9 11-9 11-9-11z' fill='none' stroke='%2338e8ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23eaf6ff'/%3E%3C/svg%3E">
<title>Shadow Protocol — a neon-noir stealth game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #04060d;
  }
  body {
    /* A soft neon wash shows for the first frame before the canvas paints. */
    background:
      radial-gradient(circle at 68% 38%, rgba(46, 120, 170, 0.12), transparent 46%),
      radial-gradient(circle at 22% 72%, rgba(255, 61, 139, 0.07), transparent 42%),
      #04060d;
  }
  #game {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    outline: none;
  }
  /* Read aloud by screen readers, never shown. */
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  noscript {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    color: #eaf6ff;
    font: 16px system-ui, sans-serif;
  }
</style>
</head>
<body>
<canvas
  id="game"
  tabindex="0"
  aria-label="Shadow Protocol: a top-down stealth game. Move with WASD or arrow keys, sprint with Shift, crouch with Control, throw a noise decoy with the mouse, and reach the exit without being detected."
></canvas>
<p id="status" role="status" aria-live="polite">Shadow Protocol. Press Space or click to deploy.</p>
<noscript>Shadow Protocol needs JavaScript enabled to run.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
